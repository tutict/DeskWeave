[project]
name = "deskweave-plugin-anime-modeling"
version = "0.0.1"
description = "Example DeskWeave plugin: anime reference collection -> Blender reference plane workflow."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deskweave-contracts",
    "deskweave-plugin-sdk",
    "deskweave-adapter-browser",
    "deskweave-adapter-blender",
]

[tool.uv.sources]
deskweave-contracts = { workspace = true }
deskweave-plugin-sdk = { workspace = true }
deskweave-adapter-browser = { workspace = true }
deskweave-adapter-blender = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deskweave_plugin_anime_modeling"]
