[project]
name = "deskweave-adapter-blender"
version = "0.0.1"
description = "Blender connector for DeskWeave (bpy-based; Phase 0 lifecycle skeleton)."
requires-python = ">=3.12"
dependencies = [
    "deskweave-contracts",
    "deskweave-adapter-sdk",
]

[tool.uv.sources]
deskweave-contracts = { workspace = true }
deskweave-adapter-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deskweave_adapter_blender"]
