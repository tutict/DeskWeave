[project]
name = "deskweave-adapter-filesystem"
version = "0.0.1"
description = "Read-only filesystem connector for DeskWeave with allowed-root enforcement."
requires-python = ">=3.12"
dependencies = [
    "deskweave-contracts",
    "deskweave-adapter-sdk",
]

[tool.uv.sources]
deskweave-contracts = { workspace = true }
deskweave-adapter-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deskweave_adapter_filesystem"]
