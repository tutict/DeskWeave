[project]
name = "deskweave-adapter-browser"
version = "0.0.1"
description = "Browser connector for DeskWeave (Playwright-based; Phase 0 lifecycle skeleton)."
requires-python = ">=3.12"
dependencies = [
    "deskweave-contracts",
    "deskweave-adapter-sdk",
    "playwright>=1.64.0",
]

[tool.uv.sources]
deskweave-contracts = { workspace = true }
deskweave-adapter-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deskweave_adapter_browser"]
