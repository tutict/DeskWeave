[project]
name = "deskweave-adapter-wikimedia"
version = "0.0.1"
description = "Wikimedia Commons reference-image connector for DeskWeave (public MediaWiki API, no scraping)."
requires-python = ">=3.12"
dependencies = [
    "deskweave-contracts",
    "deskweave-adapter-sdk",
]

[tool.uv.sources]
deskweave-contracts = { workspace = true }
deskweave-adapter-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deskweave_adapter_wikimedia"]
