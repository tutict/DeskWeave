[project]
name = "deskweave-runtime"
version = "0.0.1"
description = "DeskWeave local core runtime: lifecycle, config, adapter registry, workflow state, permissions, artifacts, events and SQLite persistence."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deskweave-contracts",
    "deskweave-adapter-sdk",
    "aiosqlite>=0.22.1",
]

[project.scripts]
deskweave-runtime = "deskweave_runtime.service.__main__:main"

[tool.uv.sources]
deskweave-contracts = { workspace = true }
deskweave-adapter-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deskweave_runtime"]
