[project]
name = "deskweave-adapter-sdk"
version = "0.0.1"
description = "Adapter SDK for DeskWeave: connector contract, capability model, registry and a reusable mock adapter."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deskweave-contracts",
    "jsonschema>=4.26",
]

[tool.uv.sources]
deskweave-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deskweave_adapter_sdk"]
