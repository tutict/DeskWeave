[project]
name = "deskweave-mcp-gateway"
version = "0.0.1"
description = "MCP gateway exposing authorised DeskWeave runtime tools to agents over stdio."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deskweave-contracts",
    "deskweave-runtime",
    "mcp>=2.3.0",
]

[project.scripts]
deskweave-mcp = "deskweave_mcp_gateway.__main__:main"

[tool.uv.sources]
deskweave-contracts = { workspace = true }
deskweave-runtime = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deskweave_mcp_gateway"]
