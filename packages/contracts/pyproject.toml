[project]
name = "deskweave-contracts"
version = "0.0.1"
description = "Shared, dependency-light data contracts for DeskWeave (errors, ids, events, artifacts, permissions, adapter + workflow models)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.14.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deskweave_contracts"]
