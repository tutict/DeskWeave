[project]
name = "deskweave-plugin-sdk"
version = "0.0.1"
description = "Plugin SDK for DeskWeave: plugin manifest and setup contract for cross-application workflows."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["deskweave-contracts"]

[tool.uv.sources]
deskweave-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deskweave_plugin_sdk"]
