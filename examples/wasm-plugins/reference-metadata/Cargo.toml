[package]
name = "deskweave-plugin-reference-metadata"
version = "0.1.0"
edition = "2021"
description = "Example DeskWeave WASM plugin: validates reference-image metadata through the host."
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Matches the workspace's release posture: small, stripped, and a panic becomes a
# wasm trap instead of an unwinding catastrophe inside the sandbox.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
